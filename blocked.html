<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blocked — focus session</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  main { max-width: 520px; text-align: center; }
  .site { color: var(--accent); }
  .big { font-size: 72px; font-weight: 700; letter-spacing: -.03em; margin: 12px 0 0; }
  h2 { font-size: 28px; margin: 0 0 6px; }
  textarea { margin-top: 18px; min-height: 70px; resize: vertical; }
</style>
</head>
<body>
  <main>
    <p class="muted mono" id="site"></p>
    <h2>Not right now.</h2>
    <p class="muted">You started a focus session. This site unlocks when it ends.</p>
    <div class="big mono" id="left">--:--</div>
    <p class="muted" style="margin-top:0">remaining</p>
    <textarea id="note" placeholder="What were you about to look up? Park it here and come back later."></textarea>
    <p class="muted" style="font-size:12px" id="saved"></p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
